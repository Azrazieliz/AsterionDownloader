name: Asterion Downloader v1.3.58 — installable APK

on:
  push:
    branches:
      - work/downloader-single-build-staging-20261112
    paths:
      - '.github/workflows/downloader-v1358-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installable-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile and test the actual v1.3.58 app, then assemble installable APK
        run: gradle --no-daemon testPilotUnitTest testAcceptanceUnitTest assemblePhonepilot --stacktrace --console=plain
      - name: Verify APK, package identity, version and signing
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/phonepilot/app-phonepilot.apk
          test -s "$APK"
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$TOOLS/aapt" dump badging "$APK" | grep -F "package: name='com.azrael.pixivdumpsync.testphone1111'"
          "$TOOLS/aapt" dump badging "$APK" | grep -F "versionName='1.3.58-phone-test'"
          "$TOOLS/apksigner" verify --verbose "$APK"
          unzip -t "$APK" >/dev/null
          cp "$APK" Asterion-Downloader-v1.3.58-PhoneTest.apk
          sha256sum Asterion-Downloader-v1.3.58-PhoneTest.apk > Asterion-Downloader-v1.3.58-PhoneTest.sha256
          "$TOOLS/apksigner" verify --print-certs "$APK" > Asterion-Downloader-v1.3.58-PhoneTest-signer.txt
          echo "Installation package: com.azrael.pixivdumpsync.testphone1111"
          echo "This is a separate test app; it MUST NOT be offered as an in-place update of the installed .acceptance package."
      - uses: actions/upload-artifact@v4
        with:
          name: Asterion-Downloader-v1.3.58-PhoneTest-APK
          if-no-files-found: error
          retention-days: 30
          path: |
            Asterion-Downloader-v1.3.58-PhoneTest.apk
            Asterion-Downloader-v1.3.58-PhoneTest.sha256
            Asterion-Downloader-v1.3.58-PhoneTest-signer.txt
