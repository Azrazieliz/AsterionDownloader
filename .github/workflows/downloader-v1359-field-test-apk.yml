name: Downloader v1.3.59 Installable Field Test

on:
  push:
    branches: [work/downloader-single-build-staging-20261112]
    paths:
      - '.github/workflows/downloader-v1359-field-test-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile source, exercise regressions and build the actual field APK
        run: gradle --no-daemon testPilotUnitTest testAcceptanceUnitTest assembleFieldpilot --stacktrace --console=plain
      - name: Validate APK and install identity before publication
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/fieldpilot/app-fieldpilot.apk
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='com.azrael.pixivdumpsync.testphone1113'" apk-badging.txt
          grep -F "versionName='1.3.59-field-test'" apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" > APK-signer.txt
          unzip -t "$APK" >/dev/null
          test "$(unzip -Z1 "$APK" | grep -cE '^lib/arm64-v8a/.*\.so$')" -gt 0
          test "$(unzip -Z1 "$APK" | grep -cE '^lib/x86_64/.*\.so$')" -gt 0
          cp "$APK" Asterion-Downloader-v1.3.59-FieldTest.apk
          sha256sum Asterion-Downloader-v1.3.59-FieldTest.apk > Asterion-Downloader-v1.3.59-FieldTest.sha256
          printf '%s\n' "$GITHUB_SHA" > Source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Asterion-Downloader-v1.3.59-Verified-FieldTest-APK
          if-no-files-found: error
          retention-days: 30
          path: |
            Asterion-Downloader-v1.3.59-FieldTest.apk
            Asterion-Downloader-v1.3.59-FieldTest.sha256
            Source-commit.txt
            APK-signer.txt
            apk-badging.txt
