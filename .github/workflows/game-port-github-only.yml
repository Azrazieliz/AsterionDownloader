name: Build independent Android game port (GitHub only)

on:
  workflow_dispatch:
    inputs:
      source_archive:
        description: "Optional repository path to complete game ZIP under game-ports/inbox/"
        required: false
        type: string
      source_release_tag:
        description: "Or GitHub Release tag holding a complete game ZIP uploaded from phone"
        required: false
        type: string
      source_asset_name:
        description: "Exact game ZIP asset name in that GitHub Release"
        required: false
        type: string
      package_id:
        description: "Unique Android application ID, e.g. com.asterion.portable.mygame"
        required: true
        type: string
      game_title:
        description: "Android game display title"
        required: true
        type: string
      engine_mode:
        description: "Engine to export; native modes require a complete editable game project"
        required: true
        default: automatic
        type: choice
        options:
          - automatic
          - godot
          - renpy

permissions:
  contents: read

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Retrieve optional game ZIP from same-repository GitHub Release
        if: inputs.source_release_tag != '' && inputs.source_asset_name != ''
        shell: bash
        env:
          SOURCE_TAG: ${{ inputs.source_release_tag }}
          SOURCE_ASSET: ${{ inputs.source_asset_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_TAG" =~ ^[A-Za-z0-9._-]{1,120}$ ||
                ! "$SOURCE_ASSET" =~ ^[A-Za-z0-9._-]+\.zip$ ]]; then
            echo "::error::Invalid release tag or ZIP asset name"
            exit 1
          fi
          ROOT="$RUNNER_TEMP/asterion-game-input"
          mkdir -p "$ROOT"
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$SOURCE_ASSET" --dir "$ROOT"
          test -s "$ROOT/$SOURCE_ASSET"
          echo "ASTERION_GAME_SOURCE=$ROOT/$SOURCE_ASSET" >> "$GITHUB_ENV"
      - name: Validate input archive scope
        shell: bash
        env:
          INPUT_PATH: ${{ inputs.source_archive }}
          ANDROID_PACKAGE: ${{ inputs.package_id }}
          GAME_TITLE: ${{ inputs.game_title }}
        run: |
          python - <<'PY'
          import os, pathlib, re, zipfile
          root=pathlib.Path.cwd().resolve()
          raw=os.environ["INPUT_PATH"]
          release_file=os.environ.get("ASTERION_GAME_SOURCE","")
          if release_file:
              archive=pathlib.Path(release_file).resolve()
              allowed=(pathlib.Path(os.environ["RUNNER_TEMP"])/"asterion-game-input").resolve()
          else:
              archive=(root/raw).resolve()
              allowed=(root/"game-ports"/"inbox").resolve()
          if not archive.is_relative_to(allowed) or archive.suffix.lower()!=".zip":
              raise SystemExit("Game source must be a trusted repository ZIP or same-repo Release asset")
          if bool(raw)==bool(release_file):
              raise SystemExit("Choose exactly one source: repository path OR Release ZIP")
          if not archive.is_file():
              raise SystemExit("Game source archive does not exist in this GitHub checkout")
          if not re.fullmatch(r"[a-z][a-z0-9_]*(?:\.[a-z][a-z0-9_]*)+",os.environ["ANDROID_PACKAGE"]):
              raise SystemExit("Invalid Android package identifier")
          if not 1<=len(os.environ["GAME_TITLE"])<=65:
              raise SystemExit("Game title must have 1-65 characters")
          if archive.stat().st_size>2_000_000_000:
              raise SystemExit("Game source archive exceeds the supported size")
          with zipfile.ZipFile(archive) as z:
              bad=z.testzip()
              if bad:raise SystemExit("Corrupt archive member: "+bad)
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as env:
              env.write("ASTERION_GAME_SOURCE="+str(archive)+"\n")
          PY
      - name: Install Godot Android exporter when requested
        if: inputs.engine_mode == 'godot'
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION=4.5.1-stable
          ROOT="$RUNNER_TEMP/asterion-godot"
          mkdir -p "$ROOT" "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          curl -fLsS --retry 3 --retry-all-errors \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" \
            -o "$ROOT/editor.zip"
          unzip -q "$ROOT/editor.zip" -d "$ROOT"
          chmod +x "$ROOT/Godot_v${GODOT_VERSION}_linux.x86_64"
          ln -s "$ROOT/Godot_v${GODOT_VERSION}_linux.x86_64" "$ROOT/godot"
          curl -fLsS --retry 3 --retry-all-errors \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" \
            -o "$ROOT/templates.tpz"
          unzip -q "$ROOT/templates.tpz" -d "$ROOT"
          cp -a "$ROOT/templates/." "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_debug.apk"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          echo "ASTERION_GODOT_EDITOR=$ROOT/godot" >> "$GITHUB_ENV"
      - name: Install official Ren'Py 8.5.3 SDK and Android RAPT
        if: inputs.engine_mode == 'renpy'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/asterion-renpy"
          mkdir -p "$ROOT"
          curl -fLsS --retry 3 --retry-all-errors \
            https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.tar.bz2 \
            -o "$ROOT/sdk.tar.bz2"
          curl -fLsS --retry 3 --retry-all-errors \
            https://www.renpy.org/dl/8.5.3/renpy-8.5.3-rapt.zip \
            -o "$ROOT/rapt.zip"
          tar -xjf "$ROOT/sdk.tar.bz2" -C "$ROOT"
          SDK="$ROOT/renpy-8.5.3-sdk"
          test -f "$SDK/renpy.sh"
          chmod +x "$SDK/renpy.sh"
          unzip -q "$ROOT/rapt.zip" -d "$SDK"
          test -f "$SDK/rapt/buildlib/rapt/plat.py"
          # The official RAPT sdk.txt points to the GitHub-hosted Android SDK.
          printf '%s\\n' "$ANDROID_HOME" > "$SDK/rapt/sdk.txt"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
            >/dev/null
          echo "ASTERION_RENPY_SDK=$SDK" >> "$GITHUB_ENV"
      - name: Export game as standalone Android APK
        env:
          ANDROID_PACKAGE: ${{ inputs.package_id }}
          GAME_TITLE: ${{ inputs.game_title }}
          ENGINE_MODE: ${{ inputs.engine_mode }}
        run: |
          set -euo pipefail
          ENGINE_ARGS=()
          if [[ "$ENGINE_MODE" == "godot" ]]; then
            ENGINE_ARGS=(--godot-editor "$ASTERION_GODOT_EDITOR")
          elif [[ "$ENGINE_MODE" == "renpy" ]]; then
            ENGINE_ARGS=(--renpy-sdk "$ASTERION_RENPY_SDK")
          fi
          python tools/package_game_android.py \
            --input "$ASTERION_GAME_SOURCE" \
            --out "$RUNNER_TEMP/asterion-game-port" \
            --package "$ANDROID_PACKAGE" \
            --label "$GAME_TITLE" \
            --gradle gradle "${ENGINE_ARGS[@]}"
          python - <<'PY'
          import json,os,pathlib
          report=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"asterion-game-port"/"port-report.json").read_text())
          if not report.get("standalone_apk"):
              raise SystemExit("No standalone Android APK produced: "+str(report.get("runtime")))
          apk=pathlib.Path(report["apk"])
          if not apk.is_file() or apk.stat().st_size<1000:
              raise SystemExit("Android APK missing or empty")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as env:
              env.write("ASTERION_GAME_APK="+str(apk)+"\n")
          PY
      - name: Verify APK package and integrity
        env:
          ANDROID_PACKAGE: ${{ inputs.package_id }}
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$ASTERION_GAME_APK" | grep -F "package: name='$ANDROID_PACKAGE'"
          unzip -t "$ASTERION_GAME_APK" >/dev/null
          sha256sum "$ASTERION_GAME_APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Asterion-Independent-Android-Game-Port
          path: |
            ${{ runner.temp }}/asterion-game-port/*-standalone.apk
            ${{ runner.temp }}/asterion-game-port/godot-standalone.apk
            ${{ runner.temp }}/asterion-game-port/apk/*.apk
          if-no-files-found: error
          retention-days: 14
