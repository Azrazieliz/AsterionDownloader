name: JAV Guru non-JK selected publisher source validation (read-only)
on:
  push:
    branches: [repair/downloader-global-search-20261121]
    paths:
      - '.github/workflows/downloader-javguru-nonjk-source-validation-20261122.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lu-selected:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Read actual first-party LU/LuluStream selected HLS (no download or signed URL logs)
        run: python3 scripts/verify_javguru_exact_selected_hls.py
  sb-selected:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Read owner-selected SB/JAVClan manifest identity (no media downloads)
        env:
          PYTHONPATH: scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 - <<'PY'
          from verify_javguru_owner_sb_full_pc import selected_player, selected_hls
          embed, page = selected_player()
          selected = selected_hls(embed, page)
          if not selected:
              raise SystemExit("Publisher selected SB did not publish verified HLS")
          print("JAV_GURU_SB_SELECTED_HLS_CONFIRMED=TRUE; NO_MEDIA_DOWNLOADED")
          PY
  lu-selected-production-kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTERION_LIVE_PROVIDERS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Production Kotlin LU selected article through real publisher relay to HLS bytes
        run: gradle :app:testAcceptanceUnitTest --tests 'com.asterion.videoflow.LiveJavGuruOriginalSourceTest' --stacktrace --console=plain
