name: JAV Guru non-JK selected publisher source validation (read-only)
on:
  push:
    branches: [repair/downloader-global-search-20261121]
    paths:
      - '.github/workflows/downloader-javguru-nonjk-source-validation-20261122.yml'
      - 'app/src/test/java/com/asterion/videoflow/LiveJavGuruOriginalSourceTest.kt'
      - 'scripts/probe_javguru_nonjk_ytdlp_metadata_20261122.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lu-selected:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Read actual first-party LU/LuluStream selected HLS (no download or signed URL logs)
        run: python3 scripts/verify_javguru_exact_selected_hls.py
  sb-selected:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Read owner-selected SB/JAVClan manifest identity (no media downloads)
        env:
          PYTHONPATH: scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 - <<'PY'
          from verify_javguru_owner_sb_full_pc import selected_player, selected_hls
          embed, page = selected_player()
          selected = selected_hls(embed, page)
          if not selected:
              raise SystemExit("Publisher selected SB did not publish verified HLS")
          print("JAV_GURU_SB_SELECTED_HLS_CONFIRMED=TRUE; NO_MEDIA_DOWNLOADED")
          PY
  lu-selected-production-kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTERION_LIVE_PROVIDERS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Production Kotlin LU selected article through real publisher relay to HLS bytes
        shell: bash
        run: |
          set +e
          gradle :app:testAcceptanceUnitTest --tests 'com.asterion.videoflow.LiveJavGuruOriginalSourceTest' --console=plain
          code=$?
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as ET
          for p in glob.glob('app/build/test-results/testAcceptanceUnitTest/*LiveJavGuruOriginalSourceTest*.xml'):
            for case in ET.parse(p).getroot().iter('testcase'):
              for failure in case.findall('failure'):
                print('JAV_GURU_EXACT_JAVA_FAILURE='+failure.attrib.get('message','')[:900])
          PY
          exit "$code"
  java-selected-post-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Distinguish Java networking denial from publisher LU source failure without fetching media
        shell: bash
        run: |
          jshell -q <<'JAVA'
          import java.net.*;
          import java.io.*;
          String site="https://jav.guru/1077002/doks-695-little-devil-jk-gives-thick-tongue-kisses-while-repeatedly-teasing-and-toying-with-you-in-a-mean-slow-handjob-until-you-cum/";
          HttpURLConnection c=(HttpURLConnection)new URL(site).openConnection();
          c.setConnectTimeout(13000); c.setReadTimeout(13000);
          c.setRequestProperty("User-Agent","Mozilla/5.0 (Linux; Android 17; Mobile) AppleWebKit/537.36 Chrome/131.0 Mobile Safari/537.36");
          c.setRequestProperty("Referer",site); c.setRequestProperty("Accept-Encoding","identity");
          c.setInstanceFollowRedirects(false);
          try{System.out.println("JAV_GURU_JAVA_POST_HTTP="+c.getResponseCode()+" CONTENT_TYPE="+c.getContentType());}catch(Exception x){System.out.println("JAV_GURU_JAVA_ERROR="+x.getClass().getSimpleName());}finally{c.disconnect();}
          /exit
          JAVA

  selected-python-extractor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install matching pinned Python extractor, metadata-only
        run: python3 -m pip install --disable-pip-version-check 'yt-dlp==2026.10.26'
      - name: Inspect only publisher-selected LU player metadata with 2026.10.26 (no bytes downloaded)
        run: python3 scripts/probe_javguru_nonjk_ytdlp_metadata_20261122.py
