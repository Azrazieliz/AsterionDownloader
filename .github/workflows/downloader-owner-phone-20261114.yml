name: Asterion Downloader — owner requested phone installer (retained preview signer)
on:
  push:
    branches: [work/downloader-single-build-staging-20261112]
    paths: ['.github/workflows/downloader-owner-phone-20261114.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verified-phone-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ASTERION_PREVIEW_STORE_PASSWORD: ${{ secrets.ASTERION_PREVIEW_STORE_PASSWORD }}
      ASTERION_PREVIEW_KEY_ALIAS: ${{ secrets.ASTERION_PREVIEW_KEY_ALIAS }}
      ASTERION_PREVIEW_KEY_PASSWORD: ${{ secrets.ASTERION_PREVIEW_KEY_PASSWORD }}
      ASTERION_PREVIEW_CERT_SHA256: ${{ secrets.ASTERION_PREVIEW_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify owner-retained preview signer — never fall back to CI debug identity
        shell: bash
        env:
          ASTERION_PREVIEW_KEYSTORE_BASE64: ${{ secrets.ASTERION_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for value in "$ASTERION_PREVIEW_KEYSTORE_BASE64" "$ASTERION_PREVIEW_STORE_PASSWORD" "$ASTERION_PREVIEW_KEY_ALIAS" "$ASTERION_PREVIEW_KEY_PASSWORD" "$ASTERION_PREVIEW_CERT_SHA256"; do
            if [ -z "$value" ]; then
              echo "::error::Stable preview signer not provisioned; refusing an incompatible installer"
              exit 1
            fi
          done
          KEY="$RUNNER_TEMP/downloader-retained-preview.p12"
          umask 077
          printf '%s' "$ASTERION_PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$KEY"
          keytool -exportcert -keystore "$KEY" -storepass "$ASTERION_PREVIEW_STORE_PASSWORD" -alias "$ASTERION_PREVIEW_KEY_ALIAS" > "$RUNNER_TEMP/preview-cert.der"
          ACTUAL="$(sha256sum "$RUNNER_TEMP/preview-cert.der" | cut -d' ' -f1)"
          test "$ACTUAL" = "${ASTERION_PREVIEW_CERT_SHA256,,}" || { echo "::error::Retained certificate mismatch"; exit 1; }
          echo "ASTERION_PREVIEW_KEYSTORE=$KEY" >> "$GITHUB_ENV"
      - name: Compile verified latest source and assemble signed Android preview
        run: gradle --no-daemon testPilotUnitTest testAcceptanceUnitTest assemblePreview --stacktrace --console=plain
      - name: Check exact package identity, signature, arm64 and artifact integrity
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/preview/app-preview.apk
          test -s "$APK"
          TOOL="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$TOOL/aapt" dump badging "$APK" > package-identity.txt
          grep -F "package: name='com.azrael.pixivdumpsync.nocturne'" package-identity.txt
          "$TOOL/apksigner" verify --verbose "$APK"
          "$TOOL/apksigner" verify --print-certs "$APK" > signer.txt
          ACTUAL="$("$TOOL/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          test "${ACTUAL,,}" = "${ASTERION_PREVIEW_CERT_SHA256,,}"
          unzip -t "$APK" >/dev/null
          test "$(unzip -Z1 "$APK" | grep -cE '^lib/arm64-v8a/.*\\.so$')" -gt 0
          SHORT="${GITHUB_SHA:0:12}"
          cp "$APK" "Asterion-Downloader-$SHORT-Signed-Preview.apk"
          sha256sum "Asterion-Downloader-$SHORT-Signed-Preview.apk" > checksum.sha256
          printf '%s\\n' "$GITHUB_SHA" > source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Asterion-Downloader-Current-Signed-Phone-Installer
          path: |
            Asterion-Downloader-*-Signed-Preview.apk
            checksum.sha256
            source-commit.txt
            package-identity.txt
            signer.txt
          if-no-files-found: error
      - name: Publish direct phone installer (not yet device accepted)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA:0:12}"
          gh release create "asterion-downloader-owner-preview-$SHORT" \
            "Asterion-Downloader-$SHORT-Signed-Preview.apk" checksum.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Asterion Downloader $SHORT — retained-signature phone trial" \
            --notes "Owner requested latest Cosplay/Kiutaku/PornPics provider repair. Signed with matching retained preview identity; separate com.azrael.pixivdumpsync.nocturne package, not an upgrade for production/acceptance/testphone1115. Tests passed in CI; publisher originals and on-phone acceptance not verified." --prerelease
      - name: Remove temporary signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/downloader-retained-preview.p12" "$RUNNER_TEMP/preview-cert.der"
