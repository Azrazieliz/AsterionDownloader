name: Asterion Downloader — Verified Backend Repair Pilot

on:
  push:
    branches:
      - work/downloader-site-adapters-errors-20261110
    paths:
      - '.github/workflows/asterion-downloader-sitefix.yml'
      - 'app/src/**'
      - 'app/build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-backend-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify approved UI is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/checkpoint/downloader-v1.3.48-ui-approved-20261110
          git diff --exit-code FETCH_HEAD HEAD -- \
            app/src/main/java/com/azrael/pixivdumpsync/AsterionHomeActivity.kt \
            app/src/main/java/com/azrael/pixivdumpsync/AsterionAdultHub.kt \
            app/src/main/java/com/azrael/pixivdumpsync/AsterionCosplayGallery.kt \
            app/src/main/java/com/azrael/pixivdumpsync/KurohaMediaPreview.kt \
            app/src/main/java/com/azrael/pixivdumpsync/SourceIndexPanel.kt \
            app/src/main/java/com/azrael/pixivdumpsync/UnifiedDownloadsUi.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile, test and assemble exact APK
        run: gradle testPilotUnitTest assemblePilot --stacktrace --console=plain
      - name: Verify APK identity, signer and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/pilot/app-pilot.apk
          test -s "$APK"
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$TOOLS/aapt" dump badging "$APK" | grep -F "package: name='com.azrael.pixivdumpsync.pilotbackend'"
          "$TOOLS/aapt" dump badging "$APK" | grep -F "versionName='1.3.49-pilot'"
          "$TOOLS/apksigner" verify "$APK"
          unzip -t "$APK" >/dev/null
          cp "$APK" Asterion-Downloader-Backend-Fix-v1.3.49.apk
          sha256sum Asterion-Downloader-Backend-Fix-v1.3.49.apk > Asterion-Downloader-Backend-Fix-v1.3.49.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Asterion-Downloader-Backend-Fix-v1.3.49
          if-no-files-found: error
          path: |
            Asterion-Downloader-Backend-Fix-v1.3.49.apk
            Asterion-Downloader-Backend-Fix-v1.3.49.sha256
      - name: Publish directly installable Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="asterion-downloader-backend-v1.3.49-$(git rev-parse --short=10 "$GITHUB_SHA")"
          gh release create "$TAG" \
            Asterion-Downloader-Backend-Fix-v1.3.49.apk \
            Asterion-Downloader-Backend-Fix-v1.3.49.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Asterion Downloader v1.3.49 — Backend Repair Pilot" \
            --notes "Temporary pre-merge Android testing APK. Approved v1.3.48 UI is unchanged. Backend repairs: bounded yt-dlp metadata and stalled transfers, robust multi-line metadata JSON extraction, durable due-time retries and permanent-error classification, verified same-provider canonical redirects and use of explicitly authorized site browser sessions. REGRESSION TESTS PASS. This build is NOT proof that every third-party provider supplies downloadable originals; HTTP 403 and inaccessible content require a valid authorized session or adapter work. App package com.azrael.pixivdumpsync.pilotbackend is DISTINCT from v1.3.48, retaining the previous install and its private data. No data migration. Debug signing is intended for this temporary acceptance build, not seamless production updates." \
            --prerelease
