name: Asterion Downloader — Verified Backend Repair Pilot

on:
  push:
    branches:
      - work/downloader-site-adapters-errors-20261110
    paths:
      - '.github/workflows/asterion-downloader-sitefix.yml'
      - 'app/src/**'
      - 'app/build.gradle.kts'
  workflow_dispatch:

# Only the newest backend-repair push should build test APK variants.
concurrency:
  group: asterion-downloader-sitefix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-backend-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify frozen gallery layout and approved behavioral corrections
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/checkpoint/downloader-v1.3.48-ui-approved-20261110
          # Exact frozen layout files cannot change. The already-approved
          # AdultHub source has a narrowly scoped thumbnail click callback
          # correction (queue the chosen original, not the entire site).
          git diff --exit-code FETCH_HEAD HEAD -- \
            app/src/main/java/com/azrael/pixivdumpsync/AsterionCosplayGallery.kt \
            app/src/main/java/com/azrael/pixivdumpsync/KurohaMediaPreview.kt \
            app/src/main/java/com/azrael/pixivdumpsync/SourceIndexPanel.kt
          # Owner approved targeted Books and Torrents simplification only.
          # Prove the rest of the frozen home/navigation/activity implementation
          # stayed byte-identical to its approved baseline.
          HOME=app/src/main/java/com/azrael/pixivdumpsync/AsterionHomeActivity.kt
          # The owner also authorized one small global PAUSE/RESUME
          # status-color correction; exclude only that text/icon state.
          for side in baseline current; do
            if [ "$side" = baseline ]; then
              git show "FETCH_HEAD:$HOME"
            else
              cat "$HOME"
            fi | awk '
              /^        emergencyLabel=text\(/ {header=1;next}
              /^        head.addView\(emergencyLabel\)/ {header=0}
              /^        if\(::emergencyLabel.isInitialized\)/ {power=1;next}
              /^        backControl.visibility=/ {power=0}
              /^        if\(requestCode==5222\)\{/ {pixivImport=1;next}
              /^        if\(requestCode==5221\)\{/ {pixivImport=0}
              /^        section\("Storage & cloud backup"/ {inventoryUi=1;next}
              /^        RounderDispatch.render\(/ {inventoryUi=0}
              /^    private fun renderBooks\(\)\{/ {allowed=1;next}
              /^    private fun renderToonily\(\)\{/ {allowed=0}
              /^            "Assets"->/ {assets=1;next}
              assets && /^            "Search"->/ {assets=0}
              !allowed && !header && !power && !assets && !pixivImport && !inventoryUi {print}
            ' > "/tmp/${side}-home-guard"
          done
          cp /tmp/baseline-home-guard /tmp/approved-home-outside-books-torrents
          cp /tmp/current-home-guard /tmp/current-home-outside-books-torrents
          cmp /tmp/approved-home-outside-books-torrents /tmp/current-home-outside-books-torrents
          grep -q 'WEBSITES · SYNC & BACKFILL' "$HOME"
          grep -q 'QUEUE COMPLETE EPUB' "$HOME"
          grep -q 'TorrentSearchUi.render' "$HOME"
          grep -q 'Mp4SeriesPanel.render' "$HOME"
          grep -q 'AssetsPanel.render(this,body)' "$HOME"
          grep -q 'LegacyPixivInventory.addTree' "$HOME"
          grep -q 'LegacyPixivInventory.hasPage' app/src/main/java/com/azrael/pixivdumpsync/SyncEngine.kt
          grep -q 'openFileDescriptor' app/src/main/java/com/azrael/pixivdumpsync/LegacyPixivInventory.kt
          grep -q 'KoikatsuInlineSearch.render' app/src/main/java/com/azrael/pixivdumpsync/AssetsPanel.kt
          grep -q 'ContentVerticalsPanel.render' app/src/main/java/com/azrael/pixivdumpsync/AssetsPanel.kt
          grep -q 'SourceIndexPanel.render' app/src/main/java/com/azrael/pixivdumpsync/AssetsPanel.kt
          # Preserve the approved Downloads structure, filters, card hierarchy
          # and commands. The owner's 2026-11-11 correction explicitly permits
          # distinct PAUSE/RESUME colors and truthful progress-state labels.
          UI=app/src/main/java/com/azrael/pixivdumpsync/UnifiedDownloadsUi.kt
          grep -q 'for(option in Filter.entries)' "$UI"
          grep -q 'for(item in filtered.take(size))' "$UI"
          grep -q 'val card=ui.row(a)' "$UI"
          grep -q 'State.ACTIVE,State.QUEUED,State.PAUSED' "$UI"
          grep -q 'action.background=ui.touch' "$UI"
          grep -q 'val actionColor=when(command)' "$UI"
          grep -q 'ModuleOriginalAgents.startAll(a.applicationContext)' "$UI"
          grep -q 'OriginalFileReceipt.verify(a,dm' "$UI"
          grep -q 'KurohaMediaPreview.render' app/src/main/java/com/azrael/pixivdumpsync/AsterionAdultHub.kt
          grep -q 'for(site in active+inactive)' app/src/main/java/com/azrael/pixivdumpsync/AsterionAdultHub.kt
          grep -q 'VideoSiteProfiles.isVideoPage(tile.url)' app/src/main/java/com/azrael/pixivdumpsync/AsterionAdultHub.kt
          if grep -q 'MANAGE WEBSITES' app/src/main/java/com/azrael/pixivdumpsync/AsterionAdultHub.kt; then
            echo 'Unapproved Manage Websites UI regression' >&2
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile, test and assemble exact APK
        run: gradle testPilotUnitTest testAcceptanceUnitTest assemblePilot assembleAcceptance assemblePhonepilot --stacktrace --console=plain
      - name: Verify APK identity, signer and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/pilot/app-pilot.apk
          test -s "$APK"
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$TOOLS/aapt" dump badging "$APK" | grep -F "package: name='com.azrael.pixivdumpsync.pilotagents'"
          "$TOOLS/aapt" dump badging "$APK" | grep -F "versionName='1.3.52-pilot'"
          "$TOOLS/apksigner" verify "$APK"
          ACCEPTANCE=app/build/outputs/apk/acceptance/app-acceptance.apk
          test -s "$ACCEPTANCE"
          "$TOOLS/aapt" dump badging "$ACCEPTANCE" | grep -F "package: name='com.azrael.pixivdumpsync.acceptance'"
          "$TOOLS/aapt" dump badging "$ACCEPTANCE" | grep -F "versionName='1.3.52-acceptance'"
          "$TOOLS/apksigner" verify "$ACCEPTANCE"
          # One-off phone tester has an intentionally unique applicationId,
          # so installation cannot overwrite the installed Agents/Acceptance apps.
          PHONE=app/build/outputs/apk/phonepilot/app-phonepilot.apk
          test -s "$PHONE"
          "$TOOLS/aapt" dump badging "$PHONE" | grep -F "package: name='com.azrael.pixivdumpsync.testphone1111'"
          "$TOOLS/aapt" dump badging "$PHONE" | grep -F "versionName='1.3.52-phone-test'"
          "$TOOLS/aapt" dump badging "$PHONE" | grep -F "application-label:'Asterion Downloader Test'"
          "$TOOLS/apksigner" verify "$PHONE"
          cp "$PHONE" Asterion-Downloader-PhoneTest-v1.3.52.apk
          sha256sum Asterion-Downloader-PhoneTest-v1.3.52.apk > Asterion-Downloader-PhoneTest-v1.3.52.sha256
          # Acceptance APKs assembled by ephemeral CI are never published.
          # Only the Windows persistent signer is authorized to publish them.
          unzip -t "$APK" >/dev/null
          cp "$APK" Asterion-Downloader-Agents-v1.3.52.apk
          sha256sum Asterion-Downloader-Agents-v1.3.52.apk > Asterion-Downloader-Agents-v1.3.52.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Asterion-Downloader-Agents-v1.3.52
          if-no-files-found: error
          retention-days: 3
          path: |
            Asterion-Downloader-Agents-v1.3.52.apk
            Asterion-Downloader-Agents-v1.3.52.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Asterion-Downloader-PhoneTest-v1.3.52
          if-no-files-found: error
          retention-days: 7
          path: |
            Asterion-Downloader-PhoneTest-v1.3.52.apk
            Asterion-Downloader-PhoneTest-v1.3.52.sha256
      # CI-generated Android debug certificates differ between runs, so a
      # published artifact cannot update the same installed app while keeping
      # its private data. The verified APK remains attached to this CI run
      # for controlled fresh-package testing. Do not publish a misleading
      # in-place update until a fixed, securely held signing identity exists.
