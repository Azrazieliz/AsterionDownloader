name: Android Unified UI Runtime Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [ "feature/asterion-unified-downloads-20261030" ]
    paths:
      - '.github/workflows/android-runtime-smoke.yml'
      - 'app/src/main/**'
      - 'app/build.gradle.kts'

jobs:
  launch-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build preview APK
        run: gradle assemblePreview --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0660", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and verify launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/preview/app-preview.apk
            adb shell am start -W -n com.azrael.pixivdumpsync.nocturne/com.azrael.pixivdumpsync.AsterionHomeActivity
            sleep 3
            adb shell pidof -s com.azrael.pixivdumpsync.nocturne | grep -Eq '[0-9]+'
            adb exec-out screencap -p > asterion-unified-home.png
            # Internally routed gallery/video activities are intentionally not exported.
            # Launch them only through app UI; an ADB shell start is a security error,
            # not an application regression.
            adb shell uiautomator dump /sdcard/asterion-ui.xml >/dev/null
            adb shell cat /sdcard/asterion-ui.xml | grep -q 'Your library'
            adb shell cat /sdcard/asterion-ui.xml | grep -q 'Porn'
            adb shell cat /sdcard/asterion-ui.xml | grep -q 'Hentai'
            # Check that gallery content opens immediately, without MEDIA buttons.
            adb shell uiautomator dump /sdcard/asterion-ui.xml >/dev/null
            adb pull /sdcard/asterion-ui.xml /tmp/asterion-ui.xml >/dev/null
            PORN_TAP=$(python3 -c 'import re,xml.etree.ElementTree as ET; r=ET.parse("/tmp/asterion-ui.xml").getroot(); a=next(n.attrib["bounds"] for n in r.iter() if n.attrib.get("text")=="Porn"); v=list(map(int,re.findall(r"\d+",a))); print((v[0]+v[2])//2,(v[1]+v[3])//2)')
            adb shell input tap $PORN_TAP
            sleep 3
            adb shell uiautomator dump /sdcard/asterion-porn.xml >/dev/null
            adb shell cat /sdcard/asterion-porn.xml | grep -q 'websites'
            adb shell cat /sdcard/asterion-porn.xml | grep -q 'MODELS'
            if adb shell cat /sdcard/asterion-porn.xml | grep -Eq 'text="MEDIA"|text="HIDE MEDIA"'; then exit 1; fi
            adb exec-out screencap -p > asterion-porn-gallery.png
            adb shell input keyevent 4
            sleep 2
            adb shell uiautomator dump /sdcard/asterion-ui.xml >/dev/null
            adb pull /sdcard/asterion-ui.xml /tmp/asterion-ui.xml >/dev/null
            HENTAI_TAP=$(python3 -c 'import re,xml.etree.ElementTree as ET; r=ET.parse("/tmp/asterion-ui.xml").getroot(); a=next(n.attrib["bounds"] for n in r.iter() if n.attrib.get("text")=="Hentai"); v=list(map(int,re.findall(r"\d+",a))); print((v[0]+v[2])//2,(v[1]+v[3])//2)')
            adb shell input tap $HENTAI_TAP
            sleep 3
            adb shell uiautomator dump /sdcard/asterion-hentai.xml >/dev/null
            adb shell cat /sdcard/asterion-hentai.xml | grep -q 'websites'
            adb shell cat /sdcard/asterion-hentai.xml | grep -q 'websites'
            adb exec-out screencap -p > asterion-hentai-gallery.png
            adb shell dumpsys package com.azrael.pixivdumpsync.nocturne | grep 'versionName=1.3.43-preview'
            adb shell pidof -s com.azrael.pixivdumpsync.nocturne | grep -Eq '[0-9]+'
            CRASHES=$(adb logcat -b crash -d)
            echo "$CRASHES"
            if echo "$CRASHES" | grep -q 'FATAL EXCEPTION'; then exit 1; fi

      - name: Upload launcher screenshot
        uses: actions/upload-artifact@v4
        with:
          name: asterion-downloader-hub-screenshot
          path: |
            asterion-unified-home.png
            asterion-porn-gallery.png
            asterion-hentai-gallery.png
          if-no-files-found: error
