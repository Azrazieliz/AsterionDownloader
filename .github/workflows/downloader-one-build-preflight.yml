name: Asterion Downloader one-build source preflight (no APK)
on:
  push:
    branches: [work/downloader-single-build-staging-20261112]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-tests-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile source and run unit tests without assembling an APK
        run: gradle testPilotUnitTest testAcceptanceUnitTest --stacktrace --console=plain
