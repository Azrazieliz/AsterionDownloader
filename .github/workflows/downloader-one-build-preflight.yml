name: Asterion Downloader one-build source preflight (no APK)
on:
  push:
    branches:
      - work/downloader-single-build-staging-20261112
      - repair/downloads-nine-providers-backfill-diagnostics-20261116
      - repair/downloader-global-search-20261121
    paths:
      - '.github/workflows/downloader-one-build-preflight.yml'
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'scripts/provider_focus_probe_batch.py'
      - 'scripts/test_provider_focus_probe_batch.py'
  workflow_dispatch:
permissions:
  contents: read
# Only the newest branch HEAD matters for a source-only release preflight.
# Cancel superseded checks to avoid redundant runner work and false reports
# about failures from temporary half-applied multi-file repair commits.
concurrency:
  group: downloader-source-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-tests-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check selected-provider engine batch results without network or APK
        run: python3 -m unittest discover -s scripts -p 'test_provider_focus_probe_batch.py' -v
      - name: Compile source and run unit tests without assembling an APK
        run: gradle :app:verifyFrozenVideoProviders testPilotUnitTest testAcceptanceUnitTest --stacktrace --console=plain
