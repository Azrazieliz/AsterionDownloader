name: Original signed Control provider contract
on:
  push:
    branches: ['work/control-v1-native-bridge-*']
    paths:
      - 'app/src/main/java/com/asterion/bridge/AsterionControlBridgeProvider.java'
      - '.github/workflows/control-provider-contract-20261128.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile real Android provider
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          JAR="$SDK/platforms/android-35/android.jar"
          if [ ! -f "$JAR" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" 'platforms;android-35' || true
          fi
          test -s "$JAR"
          mkdir -p /tmp/provider
          javac -encoding UTF-8 -source 17 -target 17 -cp "$JAR" -d /tmp/provider app/src/main/java/com/asterion/bridge/AsterionControlBridgeProvider.java
          test -s /tmp/provider/com/asterion/bridge/AsterionControlBridgeProvider.class
      - name: Verify the original signed discovery contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("app/src/main/java/com/asterion/bridge/AsterionControlBridgeProvider.java").read_text()
          call=s.split("public Bundle call(",1)[1]
          assert call.index("requireOriginalControlCaller()") < call.index('"asterion.v1.capabilities"') < call.index("requestIdValid(requestId)")
          cap=call.split('if ("asterion.v1.capabilities".equals(method))',1)[1].split('String requestId',1)[0]
          assert 'put("pack_version", 1)' in cap
          assert 'put("name","status")' in cap and 'put("name","diagnostics.summary")' in cap
          assert 'outcome_unknown' in call
          print("Signed read-only capability and receipt contract verified")
          PY
