name: Asterion Downloader — LiveCamRips exact selected Windows PC full-file
on:
  push:
    branches: [repair/downloader-global-search-20261121]
    paths:
      - '.github/workflows/downloader-pc-livecamrips-windows-selected-20261122.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selected-windows-original:
    runs-on: windows-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare real Chrome, published hoster adapters and FFprobe
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4 selenium==4.36.0 yt-dlp==2026.10.26
          choco install ffmpeg -y --no-progress
          python -m py_compile scripts/pc_livecamrips_full_selected_20261122.py
      - name: Test same selected LiveCamRips original in normal Windows Chrome
        shell: pwsh
        run: python scripts/pc_livecamrips_full_selected_20261122.py
      - name: Preserve complete file validation only, no media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livecamrips-windows-selected-original
          path: pc-livecamrips-selected-full-receipt.json
          if-no-files-found: warn
          retention-days: 14
