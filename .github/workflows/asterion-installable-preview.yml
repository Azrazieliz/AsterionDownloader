name: Asterion Downloader v1.3.31 Installable Preview

on:
  push:
    branches:
      - feature/asterion-unified-downloads-20261030
    paths:
      - '.github/workflows/asterion-installable-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test and build installable preview
        run: gradle testDebugUnitTest testPreviewUnitTest assemblePreview --stacktrace
      - name: Validate package, ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/preview/app-preview.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.azrael.pixivdumpsync.nocturne'"
          "$AAPT" dump badging "$APK" | grep -F "versionName='1.3.31-preview'"
          unzip -t "$APK" >/dev/null
          cp "$APK" Asterion-Downloader-v1.3.31-Preview.apk
          sha256sum Asterion-Downloader-v1.3.31-Preview.apk > Asterion-Downloader-v1.3.31-Preview.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Asterion-Downloader-v1.3.31-Preview-Installable
          path: |
            Asterion-Downloader-v1.3.31-Preview.apk
            Asterion-Downloader-v1.3.31-Preview.sha256
          if-no-files-found: error
      - name: Publish direct-link GitHub prerelease for Android
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="asterion-downloader-v1.3.31-preview-$(git rev-parse --short=10 "$GITHUB_SHA")"
          gh release create "$TAG" \
            Asterion-Downloader-v1.3.31-Preview.apk \
            Asterion-Downloader-v1.3.31-Preview.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Asterion Downloader v1.3.31 — Android preview" \
            --notes "Co-installable test APK built from this exact GitHub source commit. Uses the separate com.azrael.pixivdumpsync.nocturne package, so it does NOT install over or migrate data from the original signed Kuroha/Downloader installation. Automatic backfill, creator previews, full-version-only VideoFlow gating, cross-app receipts and EPUB collection are source implementations. Live account-specific services remain subject to on-device acceptance and server availability. This is NOT a preserve-data production-signature update." \
            --prerelease
