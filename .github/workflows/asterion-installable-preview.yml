name: Asterion Downloader v1.3.40 Installable Preview

on:
  push:
    branches:
      - feature/asterion-unified-downloads-20261030
    paths:
      - '.github/workflows/asterion-installable-preview.yml'
      - 'app/src/main/**'
      - 'app/src/test/**'
      - 'app/build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test Downloader sources and build installable Android preview
        run: gradle testDebugUnitTest testPreviewUnitTest assemblePreview --stacktrace
      - name: Validate package, ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/preview/app-preview.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.azrael.pixivdumpsync.nocturne'"
          "$AAPT" dump badging "$APK" | grep -F "versionName='1.3.40-preview'"
          unzip -t "$APK" >/dev/null
          cp "$APK" Asterion-Downloader-v1.3.40-Preview.apk
          sha256sum Asterion-Downloader-v1.3.40-Preview.apk > Asterion-Downloader-v1.3.40-Preview.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Asterion-Downloader-v1.3.40-Preview-Installable
          path: |
            Asterion-Downloader-v1.3.40-Preview.apk
            Asterion-Downloader-v1.3.40-Preview.sha256
          if-no-files-found: error
      - name: Publish direct-link GitHub prerelease for Android
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="asterion-downloader-v1.3.40-preview-$(git rev-parse --short=10 "$GITHUB_SHA")"
          if ! gh release create "$TAG" \
            Asterion-Downloader-v1.3.40-Preview.apk \
            Asterion-Downloader-v1.3.40-Preview.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Asterion Downloader v1.3.40 - Android preview" \
            --notes "Exact source commit and APK checksum are included. This preview displays media immediately in Porn and Hentai with the Kuroha/Pixiv gallery grid, presents Cosplay media before website management, removes the per-provider MEDIA expansion buttons, and distinguishes HOLD queued jobs from PAUSE active transfers. Previous sync, backfill, provider, video, X, comic and torrent repairs are preserved. APK and unit tests passed on the Windows workspace. Live site compatibility, cloud upload and Android device execution still require real-account/device testing. Separate com.azrael.pixivdumpsync.nocturne preview; existing production data remain untouched." \
            --prerelease; then
            echo "::warning::Release publication denied by GitHub token. Verified APK and sha256 remain available in the successfully uploaded Actions artifact."
          fi
