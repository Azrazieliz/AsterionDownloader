name: Downloader LIVE Buondua selected gallery acceptance
on:
  push:
    branches: [work/downloader-single-build-staging-20261112]
    paths:
      - 'app/src/test/java/com/azrael/pixivdumpsync/ActualProviderIntegrationTest.kt'
      - '.github/workflows/downloader-live-buondua-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-selected-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTERION_LIVE_PROVIDERS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Fetch REAL Buondua gallery, resolve original images and request one 2KB byte range
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testPilotUnitTest --tests 'com.azrael.pixivdumpsync.ActualProviderIntegrationTest.actualBuonduaGallerySelectionResolvesRealOriginalImages' --stacktrace --console=plain
      - name: Save exact failure evidence, no original images or user cookies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-buondua-original-acceptance-results
          if-no-files-found: ignore
          path: app/build/test-results/testPilotUnitTest/*.xml
          retention-days: 10
