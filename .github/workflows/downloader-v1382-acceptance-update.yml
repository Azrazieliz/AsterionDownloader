name: Asterion Downloader v1.3.82 — retained identity acceptance update
on:
  push:
    branches: [repair/downloader-global-search-20261121]
    paths:
      - '.github/workflows/downloader-v1382-acceptance-update.yml'
      - 'app/build.gradle.kts'
      - 'app/src/main/**'
      - 'app/src/test/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  owner-acceptance-update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ASTERION_PREVIEW_STORE_PASSWORD: ${{ secrets.ASTERION_PREVIEW_STORE_PASSWORD }}
      ASTERION_PREVIEW_KEY_ALIAS: ${{ secrets.ASTERION_PREVIEW_KEY_ALIAS }}
      ASTERION_PREVIEW_KEY_PASSWORD: ${{ secrets.ASTERION_PREVIEW_KEY_PASSWORD }}
      ASTERION_OWNER_ACCEPTANCE_CERT_SHA256: ${{ secrets.ASTERION_ACCEPTANCE_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify original owner acceptance signing identity or fail closed to unsigned package
        shell: bash
        env:
          ASTERION_PREVIEW_KEYSTORE_BASE64: ${{ secrets.ASTERION_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "$ASTERION_PREVIEW_KEYSTORE_BASE64" &&
                -n "$ASTERION_PREVIEW_STORE_PASSWORD" &&
                -n "$ASTERION_PREVIEW_KEY_ALIAS" &&
                -n "$ASTERION_PREVIEW_KEY_PASSWORD" &&
                -n "$ASTERION_OWNER_ACCEPTANCE_CERT_SHA256" ]]; then
            KEY="$RUNNER_TEMP/asterion-owner-retained-acceptance"
            umask 077
            printf '%s' "$ASTERION_PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$KEY"
            keytool -exportcert -keystore "$KEY"               -storepass "$ASTERION_PREVIEW_STORE_PASSWORD"               -alias "$ASTERION_PREVIEW_KEY_ALIAS" > "$RUNNER_TEMP/owner-cert.der"
            SHA="$(sha256sum "$RUNNER_TEMP/owner-cert.der" | cut -d' ' -f1)"
            if [[ "$SHA" != "${ASTERION_OWNER_ACCEPTANCE_CERT_SHA256,,}" ]]; then
              echo "::error::Configured certificate does not match installed acceptance signer; refusing incompatible APK"
              exit 1
            fi
            echo "ASTERION_PREVIEW_KEYSTORE=$KEY" >> "$GITHUB_ENV"
            echo "OWNER_SIGNED_ACCEPTANCE=true" >> "$GITHUB_ENV"
            echo "Verified retained acceptance signing certificate."
          else
            echo "OWNER_SIGNED_ACCEPTANCE=false" >> "$GITHUB_ENV"
            echo "::warning::Installed acceptance signing identity is unavailable in CI; only an unsigned owner-PC signing input can be produced."
          fi
      - name: Embed required pinned offline 2026.10.26 video extractor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          python3 -m pip download --disable-pip-version-check --no-deps --only-binary=:all: yt-dlp==2026.10.26 -d app/src/main/assets
          echo 'a05c5b5d8562f7e8a62f5334348b406af4930d56d3a65f8021d14af0e22339ae  app/src/main/assets/yt_dlp-2026.10.26-py3-none-any.whl' | sha256sum -c -
      - name: Full regression checks and build ONE owner acceptance upgrade
        run: gradle --no-daemon :app:verifyFrozenVideoProviders testPilotUnitTest testAcceptanceUnitTest assembleAcceptance --stacktrace --console=plain
      - name: Verify package identity, version, signing and installer contents
        shell: bash
        run: |
          set -euo pipefail
          TOOL="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          if [[ "$OWNER_SIGNED_ACCEPTANCE" == "true" ]]; then
            APK=app/build/outputs/apk/acceptance/app-acceptance.apk
            DEST=Asterion-Downloader-v1.3.82-Retained-Acceptance.apk
            "$TOOL/apksigner" verify --verbose "$APK"
            ACTUAL="$("$TOOL/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
            test "${ACTUAL,,}" = "${ASTERION_OWNER_ACCEPTANCE_CERT_SHA256,,}"
          else
            APK=app/build/outputs/apk/acceptance/app-acceptance-unsigned.apk
            DEST=Asterion-Downloader-v1.3.82-UNSIGNED-Owner-PC-Input.apk
            if "$TOOL/apksigner" verify "$APK"; then
              echo "::error::Unexpected signer on unsigned acceptance"
              exit 1
            fi
          fi
          test -s "$APK"
          "$TOOL/aapt" dump badging "$APK" > acceptance-apk-identity.txt
          grep -F "package: name='com.azrael.pixivdumpsync.acceptance' versionCode='111' versionName='1.3.82-acceptance'" acceptance-apk-identity.txt
          unzip -t "$APK" >/dev/null
          unzip -p "$APK" assets/yt_dlp-2026.10.26-py3-none-any.whl | sha256sum |
            grep -F 'a05c5b5d8562f7e8a62f5334348b406af4930d56d3a65f8021d14af0e22339ae'
          cp "$APK" "$DEST"
          sha256sum "$DEST" > owner-acceptance-sha256.txt
          printf '%s\n' "$GITHUB_SHA" > source-commit.txt
          printf '%s\n' "$OWNER_SIGNED_ACCEPTANCE" > owner-signature-verified.txt
          if [[ "$OWNER_SIGNED_ACCEPTANCE" != "true" ]]; then
            echo "::warning::UNSIGNED build is not directly installable; do not install it over the owner's acceptance app."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Asterion-Downloader-v1.3.82-Acceptance-Build
          path: |
            Asterion-Downloader-v1.3.82-*.apk
            owner-acceptance-sha256.txt
            acceptance-apk-identity.txt
            source-commit.txt
            owner-signature-verified.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish verified owner-signer update only — never publish unsigned or debug as upgrade
        if: env.OWNER_SIGNED_ACCEPTANCE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "asterion-downloader-v1.3.82-owner-acceptance-${GITHUB_SHA:0:10}"             Asterion-Downloader-v1.3.82-Retained-Acceptance.apk             owner-acceptance-sha256.txt             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "Asterion Downloader v1.3.82 — retained-signature acceptance update"             --notes "Verified same acceptance package and retained owner certificate. Frozen-provider regression suite passed. Live publisher acceptance: two exact PC media full transfers certified (JAV Guru JK and representative NotFans); other selected-provider transfers remain unverified or access blocked. This build is not a blanket all-sites certification."             --prerelease
      - name: Remove temporary certificate files
        if: always()
        run: rm -f "$RUNNER_TEMP/asterion-owner-retained-acceptance" "$RUNNER_TEMP/owner-cert.der"
