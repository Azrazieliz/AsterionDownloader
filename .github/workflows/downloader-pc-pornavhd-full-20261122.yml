name: Asterion Downloader — PC PornAVHD full selected-original certificate
on:
  push:
    branches: [repair/downloader-global-search-20261121]
    paths:
      - 'scripts/pc_pornavhd_full_selected_mp4_20261122.py'
      - '.github/workflows/downloader-pc-pornavhd-full-20261122.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-selected-full-original:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Chrome controls and full-file video validator
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check selenium==4.36.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffprobe
      - name: Capture only actual selected player's CDN MP4; transfer all bytes and verify SHA and duration
        shell: bash
        run: |
          set -eo pipefail
          python3 scripts/pc_pornavhd_full_selected_mp4_20261122.py | tee pc-pornavhd-full-certificate.log
      - name: Preserve receipt only; remove ephemeral media
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pc-pornavhd-complete-mp4-evidence
          path: pc-pornavhd-full-certificate.log
          if-no-files-found: ignore
          retention-days: 14
