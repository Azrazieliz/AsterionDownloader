name: Asterion Downloader LIVE browser video playback

on:
  push:
    branches: [work/downloader-single-build-staging-20261112]
    paths:
      - 'scripts/real_video_browser_probe.py'
      - '.github/workflows/downloader-real-browser-player.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Chrome WebDriver
        run: python -m pip install --disable-pip-version-check selenium==4.36.0 yt-dlp
      - name: Open real publisher streams in headless Google Chrome
        shell: bash
        run: |
          set -euo pipefail
          python scripts/real_video_browser_probe.py
          test -s real-browser-player-results.json
      - name: Attach observed playback and network statuses (no media)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-browser-playback-evidence
          path: real-browser-player-results.json
          retention-days: 30
          if-no-files-found: ignore
