name: Asterion Downloader — latest verified unsigned acceptance for owner signing
on:
  push:
    branches: [work/downloader-single-build-staging-20261112]
    paths: ['.github/workflows/downloader-owner-acceptance-unsigned-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unsigned-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ASTERION_PREVIEW_KEYSTORE: ''
      ASTERION_PREVIEW_STORE_PASSWORD: ''
      ASTERION_PREVIEW_KEY_ALIAS: ''
      ASTERION_PREVIEW_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Include exact tested embedded video extractor in acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          python3 -m pip download --disable-pip-version-check --no-deps --only-binary=:all: yt-dlp==2026.10.26 -d app/src/main/assets
          echo 'a05c5b5d8562f7e8a62f5334348b406af4930d56d3a65f8021d14af0e22339ae  app/src/main/assets/yt_dlp-2026.10.26-py3-none-any.whl' | sha256sum --check -
      - name: Compile exact current source and create UNSIGNED owner acceptance
        run: gradle --no-daemon testPilotUnitTest testAcceptanceUnitTest assembleAcceptance --console=plain
      - name: Assert no signature is present and record source/hash
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/acceptance/app-acceptance-unsigned.apk
          test -s "$APK"
          TOOL="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          if "$TOOL/apksigner" verify "$APK"; then
            echo "::error::Unsigned artifact unexpectedly signed by CI"
            exit 1
          fi
          "$TOOL/aapt" dump badging "$APK" | grep -F "package: name='com.azrael.pixivdumpsync.acceptance'"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" > unsigned.sha256
          printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Downloader-Latest-Unsigned-Acceptance-for-Owner-PC
          path: |
            app/build/outputs/apk/acceptance/app-acceptance-unsigned.apk
            unsigned.sha256
            SOURCE_COMMIT.txt
          if-no-files-found: error
