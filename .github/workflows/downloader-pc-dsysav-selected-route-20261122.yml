name: Asterion Downloader — DSYSAV fallback selected route proof (PC)
on:
  push:
    branches: [repair/downloader-global-search-20261121]
    paths:
      - 'scripts/pc_dsysav_selected_route_probe_20261122.py'
      - '.github/workflows/downloader-pc-dsysav-selected-route-20261122.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dsav-selected-source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check Python and actual public site without media download
        run: |
          python3 -m py_compile scripts/pc_dsysav_selected_route_probe_20261122.py
          python3 -m pip install --disable-pip-version-check beautifulsoup4
          python3 scripts/pc_dsysav_selected_route_probe_20261122.py
      - name: Preserve exact route evidence only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pc-dsysav-site-route-evidence
          path: pc-dsysav-route-evidence.json
          retention-days: 14
